services:
  backend:
    build:
      context: ./backend
    container_name: oos-backend
    environment:
      PORT: 8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OPENCLAW_DASHBOARD_URL: ${OPENCLAW_DASHBOARD_URL:-http://host.docker.internal:18789}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: oos-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend-data:
    driver: local
